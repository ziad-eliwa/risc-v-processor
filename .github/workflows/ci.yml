name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel older runs of the same branch/PR when you push again
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Verilator)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends verilator
          verilator --version
      - name: Lint RTL
        run: make lint

  simulate:
    name: Simulate (Icarus Verilog)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog
          iverilog -V | head -n 1
      - name: Run testbenches
        run: make test
      - name: Upload logs and waveforms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-output
          path: build/sim/
          if-no-files-found: ignore
          retention-days: 7